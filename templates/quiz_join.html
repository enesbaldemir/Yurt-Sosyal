{% extends "base.html" %}
{% block title %}Yarışmaya Katıl — Yurt Sosyal{% endblock %}
{% block extra_css %}
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/quiz-pro.css', v='2026093001') }}">
{% endblock %}
{% block content %}
<div class="kq kq-join-stage">
    <div class="kq-floaters" aria-hidden="true"><span>▲</span><span>◆</span><span>●</span><span>■</span></div>
    <div style="position:relative; z-index:1; width:100%; display:grid; place-items:center;">
        <div class="kq-join-logo">YURT<span style="color:#FFC93C;">!</span> Quiz</div>
        <form method="POST" class="kq-join-box" id="kqJoinForm" autocomplete="off">
            <div class="kq-join-step {{ '' if prefill_code else 'is-active' }}" data-step="1">
                <label for="kqPin" class="kq-sr">Oyun PIN'i</label>
                <input type="text" id="kqPin" name="code" class="pin" inputmode="numeric" maxlength="7" placeholder="Oyun PIN'i" value="{{ prefill_code }}" {{ '' if prefill_code else 'autofocus' }}>
                <button type="button" class="kq-btn" id="kqPinNext">Devam</button>
            </div>
            <div class="kq-join-step {{ 'is-active' if prefill_code }}" data-step="2">
                <div class="small fw-bold mb-2" style="color:#55556A;">PIN <span id="kqPinShow">{{ prefill_code }}</span> · <a href="#" id="kqPinEdit" style="color:#6C2BD9;">değiştir</a></div>
                <label for="kqNick" class="kq-sr">Takma ad</label>
                <input type="text" id="kqNick" name="nickname" maxlength="24" placeholder="Takma adın" value="{{ (current_user.full_name if current_user and current_user.full_name else session.username)[:24] }}" {{ 'autofocus' if prefill_code }}>
                <button type="submit" class="kq-btn">Hadi başlayalım! <i class="bi bi-arrow-right"></i></button>
            </div>
        </form>
        <p class="mt-3 mb-0 text-center" style="color:rgba(255,255,255,.8); font-weight:700; font-size:.85rem;">PIN'i sunucunun ekranında görebilirsin.</p>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
(function () {
    var pin = document.getElementById('kqPin'), steps = document.querySelectorAll('.kq-join-step');
    function go(n) { steps.forEach(function (s) { s.classList.toggle('is-active', s.dataset.step === String(n)); }); var f = steps[n - 1].querySelector('input'); if (f) setTimeout(function () { f.focus(); f.select && f.select(); }, 50); }
    pin.addEventListener('input', function () { pin.value = pin.value.replace(/\D/g, '').slice(0, 6); });
    function next() {
        if (pin.value.replace(/\D/g, '').length !== 6) { pin.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 240 }); pin.focus(); return; }
        document.getElementById('kqPinShow').textContent = pin.value; go(2);
    }
    document.getElementById('kqPinNext').addEventListener('click', next);
    pin.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); next(); } });
    document.getElementById('kqPinEdit').addEventListener('click', function (e) { e.preventDefault(); go(1); });
    document.getElementById('kqJoinForm').addEventListener('submit', function (e) { if (pin.value.replace(/\D/g, '').length !== 6) { e.preventDefault(); go(1); } });
})();
</script>
{% endblock %}
