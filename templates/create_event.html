{% extends "base.html" %}
{% block title %}Yeni Etkinlik Oluştur — Yurt Sosyal{% endblock %}
{% block content %}

<div class="d-flex align-items-center justify-content-between mb-4">
    <div>
        <span class="kicker">Etkinlikler</span>
        <h4 class="fw-bold mb-0">Yeni Etkinlik</h4>
    </div>
    <a href="{{ url_for('events') }}" class="btn btn-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Etkinliklere Dön
    </a>
</div>

<div class="card card-pad">
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">Etkinlik Başlığı</label>
            <input type="text" name="title" class="form-control" placeholder="Örn: Halı Saha Turnuvası" required autofocus>
        </div>

        <div class="mb-3">
            <label class="form-label">Etkinlik Görseli <span class="text-muted fw-normal">(Opsiyonel)</span></label>
            <input type="file" name="image" class="form-control" accept="image/png,image/jpeg,image/gif,image/webp">
            <div class="form-text">Afiş veya fotoğraf ekleyebilirsin. Görsel eklemek zorunlu değildir.</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Açıklama</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Etkinlik kuralları, gereksinimler vb."></textarea>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">Etkinlik Türü</label>
                <select name="event_type" class="form-select" required>
                    <option value="Sosyal">Sosyal</option>
                    <option value="Spor">Spor</option>
                    <option value="Eğitim">Eğitim</option>
                    <option value="Kültür">Kültür</option>
                    <option value="Diğer">Diğer</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Maksimum Katılımcı <span class="text-muted fw-normal">(Opsiyonel)</span></label>
                <input type="number" name="max_participants" class="form-control" min="1" placeholder="Örn: 20">
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label">Konum / Yer</label>
                <input type="text" name="location" class="form-control" placeholder="Örn: Yurt Bahçesi / TV Odası" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Tarih ve Saat</label>
                <input type="datetime-local" name="event_date" class="form-control" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="bi bi-calendar-plus me-1"></i> Etkinliği Yayınla
        </button>
    </form>
</div>

{% endblock %}
