{% extends "base.html" %}
{% block title %}{{ 'Kayıt Ol' if register else 'Giriş Yap' }} — YURT{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="auth-logo">
            <h1 class="serif-heading mb-1" style="font-size: 2.2rem; letter-spacing: -0.02em;">YURT.</h1>
            <p class="text-muted small mb-0">Öğrenci Sosyal Yaşam Platformu</p>
        </div>

        <div class="auth-toggle">
            <a href="{{ url_for('login') }}" class="{{ 'active' if not register }}">Giriş Yap</a>
            <a href="{{ url_for('register') }}" class="{{ 'active' if register }}">Hesap Aç</a>
        </div>

        {% if register %}
        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label class="form-label">Ad Soyad <span class="text-danger">*</span></label>
                <input type="text" name="full_name" class="form-control" placeholder="Örn: Ahmet Yılmaz" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Kullanıcı Adı</label>
                <input type="text" name="username" class="form-control" placeholder="Örn: ahmetyilmaz" required autocomplete="username" pattern="[a-z0-9çğıöşü._-]+" title="Sadece küçük harf, rakam ve . _ - kullanabilirsiniz." oninput="this.value=this.value.toLowerCase()">
            </div>
            <div class="mb-3">
                <label class="form-label">Şifre</label>
                <input type="password" name="password" class="form-control" placeholder="En az 4 karakter" required minlength="4" autocomplete="new-password">
            </div>
            <div class="mb-3">
                <label class="form-label">Oda Numarası</label>
                <input type="text" name="room_number" class="form-control" placeholder="Örn: A-204">
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" name="in_dorm" id="in_dorm" checked>
                <label class="form-check-label small" for="in_dorm">Şu anda yurtta ikamet ediyorum</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Kayıt Ol ve Katıl</button>
        </form>
        {% else %}
        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label">Kullanıcı Adı</label>
                <input type="text" name="username" class="form-control" placeholder="Kullanıcı adınızı girin" required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0">Şifre</label>
                </div>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" name="remember" id="remember_me" checked>
                <label class="form-check-label small" for="remember_me">Beni hatırla</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Giriş Yap</button>
        </form>
        {% endif %}

        <div class="mt-4 pt-3 text-center border-top" style="border-color: var(--border) !important;">
            <p class="text-faint" style="font-size: 0.72rem;">Yurt Yönetim & Sosyal İletişim Sistemi</p>
        </div>
    </div>
</div>
{% endblock %}
