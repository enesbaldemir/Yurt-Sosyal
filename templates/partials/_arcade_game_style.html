<style>
    .ag-wrap { max-width: 560px; margin: 0 auto; }
    .ag-stage { position: relative; border-radius: 22px; overflow: hidden; color: #fff; padding: 1.2rem; min-height: 430px; display: flex; flex-direction: column;
        background: radial-gradient(500px 240px at 100% 0%, rgba(255,255,255,.18), transparent 60%), linear-gradient(145deg, var(--g1), var(--g2)); box-shadow: 0 24px 50px -24px var(--g2); user-select: none; }
    .ag-hud { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .ag-pill { background: rgba(0,0,0,.22); border-radius: 999px; padding: .35rem .8rem; font-weight: 800; font-size: .9rem; font-variant-numeric: tabular-nums; }
    .ag-bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.25); margin: .8rem 0 0; overflow: hidden; }
    .ag-bar i { display: block; height: 100%; width: 100%; background: #fff; border-radius: inherit; transition: width .1s linear; }
    .ag-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .8rem; padding: 1rem 0; }
    .ag-title { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 900; }
    .ag-sub { opacity: .9; font-weight: 600; max-width: 380px; }
    .ag-start { border: 0; background: #fff; color: var(--g2); font-weight: 900; font-size: 1.1rem; padding: .85rem 2.2rem; border-radius: 14px; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
    .ag-start:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
    .ag-opts { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .ag-opt { border: 0; border-radius: 14px; min-height: 64px; font-weight: 900; font-size: 1.2rem; background: #fff; color: #1f2937; box-shadow: 0 5px 0 rgba(0,0,0,.18); transition: transform .08s; }
    .ag-opt:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
    .ag-opt.ok { background: #22c55e; color: #fff; }
    .ag-opt.bad { background: #ef4444; color: #fff; animation: ag-shake .3s; }

    .ag-combo { font-weight: 900; background: #fde047; color: #713f12; border-radius: 999px; padding: .2rem .7rem; font-size: .85rem; }
    @keyframes ag-shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @keyframes ag-up { to { transform: translateY(-50px); opacity: 0; } }
</style>
