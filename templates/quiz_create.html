{% extends "base.html" %}
{% block title %}Yeni Yarışma Oluştur — Yurt Sosyal{% endblock %}
{% block content %}

<div class="d-flex align-items-center justify-content-between mb-4">
    <div class="d-flex align-items-center gap-2">
        <a href="{{ url_for('quiz_list') }}" class="icon-btn" title="Yarışmalara Dön">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
            <span class="kicker">Quiz Editörü</span>
            <h4 class="fw-bold mb-0">Yeni Yarışma</h4>
        </div>
    </div>
</div>

<div class="card card-pad">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Yarışma Başlığı</label>
            <input type="text" name="title" class="form-control" placeholder="Örn: Yurt Genel Kültür & Tarih Quiz" required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label">Açıklama <span class="text-muted fw-normal">(İsteğe Bağlı)</span></label>
            <textarea name="description" class="form-control" rows="3" placeholder="Yarışma içeriği hakkında kısa bilgi..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="bi bi-plus-lg me-1"></i> Yarışmayı Oluştur ve Soru Eklemeye Geç
        </button>
    </form>
</div>

{% endblock %}
